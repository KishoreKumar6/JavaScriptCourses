<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasicTodoList</title>
  </head>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
    }
    .todo-grid, .input-grid{
      display: grid;
      grid-template-columns: 200px 150px 150px;
      gap: 15px;
      align-items: center;
    }
    .input-grid{
      margin-bottom: 15px;
      align-items: stretch;
    }
    .js-dueDate{
      padding: 8px 20px;
      font-size: large;
    }
    .del-btn{
      padding: 8px 20px;
      font-size: large;
      background-color: darkred;
      border: none;
      color: white;
      cursor: pointer;
    }
    .js-btn{
      background-color: green;
      color: white;
      font-size: large;
      border: none;
      cursor: pointer;
    }
  </style>
  <body>
    <div class="input-grid">
    <input
      type="text"
      placeholder="Todo  name"
      onkeydown="keydown(event)"
      class="js-input"
    />
    <input type="date" class="js-dueDate" />
    <button class="js-btn" onclick="add()">Add</button>
  </div>
    <div class="js-todoList todo-grid"></div>
    <script>
      const todoList = [
        {
          name: "make dinner",
          dueDate: "2022-12-22",
        },
        {
          name: "wash dinner",
          dueDate: "2022-12-24",
        },
      ];

      function rendertodolist() {
        let todoListHtml = "";

        for (let i = 0; i < todoList.length; i++) {
          const todoObject = todoList[i];
          // const name = todoObject.name
          // const dueDate = todoObject.dueDate;
          const { name, dueDate } = todoObject;
          const html = `
          <div class="name">${name} </div>
          <div class="dueDate">${dueDate} </div>
          <button 
          onclick="todoList.splice(${i},1)
          rendertodolist()" class="del-btn"
          >Delete</button>
        `;
          todoListHtml = todoListHtml + html;
        }

        document.querySelector(".js-todoList").innerHTML = todoListHtml;
      }

      function add() {
        let input = document.querySelector(".js-input");
        const name = input.value;

        const dueDateElement = document.querySelector(".js-dueDate");
        const dueDate = dueDateElement.value;

        todoList.push({
          // name: name,
          // dueDate: dueDate,
          name,
          dueDate,
        });

        input.value = "";

        rendertodolist();
      }

      function keydown(event) {
        if (event.key === "Enter") {
          add();
        }
      }
    </script>
  </body>
</html>
