<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Income Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="ledger">
        <h2>Income Expense Tracker</h2>
        <h4>Your Balance</h4>
        <h1 id="balance">₹ 0.00</h1>
        <div class="inc-exp-container">
          <div class="inc">
            <h4>Income</h4>
            <p id="inc-amt" class="amt plus">₹ 0.00</p>
          </div>
          <div class="exp">
            <h4>Expense</h4>
            <p id="exp-amt" class="amt minus">₹ 0.00</p>
          </div>
        </div>
        <form action="#" id="form">
          <div class="form-control">
            <label for="desc">Description</label>
            <input
              type="text"
              name="desc"
              id="desc"
              placeholder="Enter Description"
            />
          </div>
          <!-- Toggle Button Controls for Income / Expense -->
          <div class="form-control">
            <label>Transaction Type:</label>
            <div class="toggle-buttons">
              <button
                type="button"
                id="income-toggle"
                class="toggle-button active"
                data-type="inc"
              >
                Income
              </button>
              <button
                type="button"
                id="expense-toggle"
                class="toggle-button"
                data-type="exp"
              >
                Expense
              </button>
            </div>
          </div>
          <div class="form-control">
            <label for="amount">Amount</label>
            <input
              type="number"
              name="amount"
              id="amount"
              placeholder="Amount"
            />
          </div>
          <button class="btn" type="submit">Add Transaction</button>
        </form>
      </div>
      <div class="transaction">
        <h3>Transaction Details</h3>
        <!-- New toggle buttons for filtering displayed transactions -->
        <div class="toggle-buttons filter-btn">
          <button type="button" class="toggle-button active" data-filter="all">
            All
          </button>
          <button type="button" class="toggle-button" data-filter="inc">
            Income
          </button>
          <button type="button" class="toggle-button" data-filter="exp">
            Expense
          </button>
        </div>
        <ul class="trans" id="trans">
          <!-- Static transactions as placeholders (they will be overwritten when transactions load) -->
          <li class="exp">
            Insurance
            <span>-1500</span>
            <button class="btn-del">x</button>
          </li>
          <li class="inc">
            Salary
            <span>35000</span>
            <button class="btn-del">x</button>
          </li>
          <li class="exp">
            Food
            <span>-350</span>
            <button class="btn-del">x</button>
          </li>
        </ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
